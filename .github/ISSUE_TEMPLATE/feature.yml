name: Feature request
description: AI SUMMIT PRD 기반 기능·설계·문서 작업 제안
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        기존 [PRD](https://github.com/vicircle22/OSS/blob/main/docs/AI-SUMMIT-PRD.md)와 [와이어프레임](https://github.com/vicircle22/OSS/blob/main/docs/AI-SUMMIT-Wireframes.md)을 기준으로 작성해주세요.
        제출 후 기존 주차 마일스톤, priority/area/sprint 라벨과 [Projects](https://github.com/users/XAplus/projects/5)에 연결합니다.
  - type: textarea
    id: user-value
    attributes:
      label: 사용자 가치와 해결할 문제
      placeholder: 누가 어떤 상황에서 어떤 작업을 할 수 있어야 하나요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: PRD 근거 및 작업 범위
      placeholder: 관련 PRD 절·요구사항 ID, 포함할 작업과 후속 범위
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 검증 가능한 조건을 체크리스트로 작성합니다.
      value: |
        - [ ] 핵심 동작을 구현 또는 문서화한다.
        - [ ] 정상·실패 시나리오를 검증한다.
        - [ ] PR과 검증 근거를 첨부한다.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 의존성 및 관련 이슈
      placeholder: "선행 이슈 #번호, API·ERD·화면 계약 등"
  - type: input
    id: estimate
    attributes:
      label: 상대 추정 points
      description: 1, 2, 3, 5, 8 등 상대 추정입니다. 팀 합의 후 Projects Estimate에 반영합니다.
      placeholder: "3"
  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      placeholder: 테스트·API 응답·화면·문서 검토 등 완료를 확인할 방법
    validations:
      required: true
