name: Reusable Python checks
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python_version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      revision:
        required: true
        type: string
      label:
        required: true
        type: string
      use_cache:
        default: true
        type: boolean
      cache_namespace:
        default: production-v1
        type: string
permissions:
  contents: read
jobs:
  check:
    name: Check ${{ inputs.label }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: environment
        uses: ./.github/actions/python-environment
        with:
          python_version: ${{ inputs.python_version }}
          cache_enabled: ${{ inputs.use_cache }}
          cache_namespace: ${{ inputs.cache_namespace }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming
      - name: Verify and extract the built artifact
        env:
          REVISION: ${{ inputs.revision }}
        run: python scripts/ci/package.py verify --artifact-dir incoming --out unpacked --revision "$REVISION"
      - name: Lint the packaged code
        working-directory: unpacked/ai-summit
        env:
          CI_PYTHON: ${{ steps.environment.outputs.python_path }}
        run: '"$CI_PYTHON" -m ruff check scripts tests'
      - name: Test the packaged code
        working-directory: unpacked/ai-summit
        env:
          CI_PYTHON: ${{ steps.environment.outputs.python_path }}
        run: |
          set -o pipefail
          "$CI_PYTHON" -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Record measured cache preparation
        env:
          LABEL: ${{ inputs.label }}
          DEPENDENCY_SECONDS: ${{ steps.environment.outputs.dependency_seconds }}
          CACHE_HIT: ${{ steps.environment.outputs.cache_hit }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          data = {
              'label': os.environ['LABEL'], 'revision': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'runner_os': os.environ['RUNNER_OS'],
              'python_version': platform.python_version(),
              'requirements_sha256': hashlib.sha256(Path('requirements-ci.txt').read_bytes()).hexdigest(),
              'dependency_seconds': float(os.environ['DEPENDENCY_SECONDS']), 'cache_hit': os.environ['CACHE_HIT']
          }
          Path('metrics.json').write_text(json.dumps(data, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Save tests and measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-${{ inputs.label }}
          path: |
            unpacked/ai-summit/test-results.txt
            metrics.json
          retention-days: 30
          if-no-files-found: warn
