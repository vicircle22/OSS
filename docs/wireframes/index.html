const samples=[
 {id:'c1',title:'AI 개발 도구를 프로젝트에 도입하는 방법',source:'개발 블로그',url:'https://example.com/ai-tool-guide',category:'AI 도구',tags:['개발','AI 도구','API'],date:'2026.10.01',status:'READY',stale:false,body:'이 글은 AI 개발 도구를 작은 프로젝트에 도입하는 절차를 설명합니다. 먼저 문서에서 입력 형식과 응답 형식을 확인하고, API 키를 환경변수에 저장합니다. 이후 예제 요청을 실행해 응답을 확인합니다. 처음부터 전체 서비스를 변경하기보다 한 가지 기능으로 도입 범위를 좁힙니다. 테스트 결과에서 유용성, 응답 지연, 예상 호출량을 기록하고 프로젝트에 적용할지 판단합니다. 이 본문은 와이어프레임을 위한 가상 예시입니다.',summary:{headline:'작은 테스트를 통해 AI 개발 도구의 적용 가능성을 확인하는 단계별 가이드입니다.',points:['입력·응답 형식을 확인하고 API 키를 환경변수로 관리합니다.','한 가지 기능을 선택해 샘플 요청을 실행합니다.','결과의 유용성, 지연, 호출량을 기록해 도입 여부를 판단합니다.'],importance:'새 도구를 학습하는 개발자는 작은 검증부터 시작해 프로젝트에 적용할 수 있습니다. 도입 전 테스트 기록은 기술 선택의 근거가 됩니다.',tech:['LLM API','환경변수','REST API'],keywords:['개발 도구','API','프로토타입']},actions:[{id:'a1',title:'문서의 입력·응답 형식을 확인한다',description:'입력 필드와 응답 예제를 읽고 테스트에 필요한 항목을 메모하면 완료입니다.',done:true},{id:'a2',title:'개발 환경에서 샘플 요청을 실행한다',description:'API 키를 환경변수로 설정하고 예제 요청 1건의 응답을 기록하면 완료입니다.',done:false},{id:'a3',title:'작은 테스트 결과를 정리한다',description:'결과의 유용성, 응답 지연, 호출량을 메모하고 도입 여부를 결정하면 완료입니다.',done:false}]},
 {id:'c2',title:'RAG 검색 품질을 점검하는 체크리스트',source:'개발 커뮤니티',url:'https://example.com/rag-checklist',category:'개발·활용',tags:['RAG','개발','검색'],date:'2026.09.30',status:'READY',stale:false,body:'RAG 서비스에서는 답변 생성 전에 검색 결과가 적절한지 확인해야 합니다. 자주 묻는 질문을 평가 데이터로 정리하고 질문마다 검색한 문서를 비교합니다. 문서 청크 크기와 검색 개수를 조정하면서 관련 자료가 반환되는지 관찰합니다. 답변 내용만 비교하면 검색 단계의 오류를 놓칠 수 있으므로 검색 결과와 최종 응답을 함께 기록합니다. 이 글은 실제 연구 자료가 아닌 와이어프레임용 예시입니다.',summary:{headline:'RAG의 답변 품질을 개선하려면 검색 단계부터 별도로 평가해야 합니다.',points:['대표 질문과 기대 자료를 평가 데이터로 준비합니다.','청크 크기와 검색 개수를 바꿔 검색 결과를 비교합니다.','검색 문서와 최종 응답을 함께 기록해 오류를 구분합니다.'],importance:'검색 품질을 따로 점검하면 응답 문제의 원인을 파악하기 쉽습니다. RAG 프로젝트의 반복 테스트 기준으로 활용할 수 있습니다.',tech:['RAG','벡터 검색','청킹'],keywords:['검색 품질','평가','청크']},actions:[{id:'a4',title:'대표 질문 5개를 작성한다',description:'실제 사용 질문 5개와 기대 자료를 한 표에 정리하면 완료입니다.',done:true},{id:'a5',title:'검색 결과를 비교한다',description:'청크 크기 또는 검색 개수를 바꾸고 질문별 결과를 비교하면 완료입니다.',done:false},{id:'a6',title:'검색과 응답 오류를 구분한다',description:'검색 문서와 응답을 나란히 기록하고 개선할 항목 1개를 선택하면 완료입니다.',done:false}]},
 {id:'c3',title:'멀티모달 프롬프트 실험 기록하기',source:'직접 입력',url:'',category:'모델·연구',tags:['프롬프트','멀티모달'],date:'2026.09.28',status:'READY',stale:false,body:'멀티모달 모델을 비교할 때는 같은 이미지와 같은 질문을 사용하고 출력 차이를 기록합니다. 이미지의 어떤 부분을 설명해야 하는지 프롬프트에 구체적으로 적습니다. 한 번의 응답으로 성능을 단정하지 않고 몇 가지 사례를 반복해 확인합니다. 모델이 이미지에 없는 정보를 말하는지도 점검합니다. 이 텍스트는 인터페이스 검토를 위해 작성한 가상 자료입니다.',summary:{headline:'같은 입력으로 멀티모달 프롬프트를 비교하고 결과를 기록하는 실험 방법입니다.',points:['동일한 이미지와 질문으로 결과를 비교합니다.','관찰할 요소를 프롬프트에 구체적으로 명시합니다.','반복 사례로 확인하고 이미지에 없는 정보를 점검합니다.'],importance:'실험 입력을 일정하게 유지하면 프롬프트 변경의 영향을 비교하기 쉽습니다. 모델 출력의 오류를 기록하는 학습 활동에 사용할 수 있습니다.',tech:['멀티모달 모델','프롬프트'],keywords:['이미지','비교 실험']},actions:[{id:'a7',title:'같은 이미지로 프롬프트 2개를 비교한다',description:'입력 이미지 1개를 고정하고 질문 방식이 다른 두 결과를 기록하면 완료입니다.',done:false},{id:'a8',title:'출력의 오류를 확인한다',description:'이미지와 응답을 비교해 없는 정보나 누락된 요소를 표시하면 완료입니다.',done:false}]},
 {id:'c4',title:'Threads에서 저장한 AI 도구 소개',source:'Threads',url:'https://www.threads.net/@example/post/demo',category:'AI 도구',tags:['AI 도구'],date:'2026.09.27',status:'NEEDS_TEXT',stale:false,body:'',summary:null,actions:[]}

let contents=structuredClone(samples),route='library',selected='c1',detailTab='summary',inputType='url',editing=false,formDraft=null,filter={q:'',category:'',status:'',tag:''},actionFilter='pending',scenario='normal',editingAction=null,toastTimer,jobTimers=[];
const annotations={library:['WF-01','목록에서 제목·출처·태그·분석 상태·행동 진행을 확인합니다. 검색과 카테고리·상태·태그는 AND 조건이며, 모바일에서는 행이 카드형으로 바뀝니다.'],save:['WF-02','URL 또는 텍스트를 등록합니다. URL 수집이 어려우면 본문을 붙여넣습니다. 저장과 AI 분석은 분리되어 저장 완료 후 상세 화면에서 상태를 확인합니다.'],detail:['WF-03','요약·Action Items·원문을 탭으로 구분합니다. AI의 중요성 해석과 원문을 구분하고, 분석 실패·이전 본문 기준 상태에서도 원문을 보존합니다.'],actions:['WF-04','콘텐츠를 넘어 미완료 행동을 모아봅니다. 완료 체크·취소·편집·삭제는 상세 화면과 동일한 데이터를 사용하며 원본 자료로 돌아갈 수 있습니다.']};
const current=()=>contents.find(c=>c.id===selected)||contents[0];
const allActions=()=>contents.flatMap(c=>c.actions.map(a=>({...a,content:c})));
const statusClass=s=>s==='READY'?'ready':s==='FAILED'?'failed':s==='NEEDS_TEXT'?'needs':'';
const statusHTML=c=>`<span class="status ${statusClass(c.status)}">${c.status==='READY'?'✓ ':''}${esc(labels[c.status])}${c.stale?' · 이전 본문 기준':''}</span>`;
const done=c=>c.actions.filter(a=>a.done).length;
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',4000)}
function syncChrome(){const navRoute=route==='actions'?'actions':'library';$('navLibrary').classList.toggle('active',navRoute==='library');$('navActions').classList.toggle('active',navRoute==='actions');$('mobileLibrary').classList.toggle('active',route==='library');$('mobileActions').classList.toggle('active',route==='actions');$('screenPicker').value=route;$('breadcrumb').textContent={library:'내 콘텐츠',save:editing?'콘텐츠 편집':'콘텐츠 저장',detail:'콘텐츠 상세',actions:'Action Items'}[route];$('contentCount').textContent=contents.length;$('actionCount').textContent=allActions().filter(a=>!a.done).length;$('navActions').setAttribute('aria-label',`Action Items, 미완료 ${allActions().filter(a=>!a.done).length}개`);const tags=[...new Set(contents.flatMap(c=>c.tags))].slice(0,6);$('sideTags').innerHTML=`<div class="nav-label" style="width:100%;margin:0 0 4px">TAGS</div>`+tags.map(t=>`<button class="side-tag ${filter.tag===t?'active':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');$('wireId').textContent=annotations[route][0];$('annotation').textContent=annotations[route][1]}
function go(next,options={}){route=next;if(options.id)selected=options.id;if(options.tab)detailTab=options.tab;if(next==='save'){editing=!!options.edit;formDraft=editing?structuredClone(current()):null;inputType=editing?(formDraft.url?'url':'text'):'url'}editingAction=null;render();$('main').focus({preventScroll:true})}
function render(){syncChrome();$('main').innerHTML=route==='library'?libraryHTML():route==='save'?saveHTML():route==='detail'?detailHTML():actionsHTML();bindScreen();}
function libraryHTML(){const base=scenario==='empty'?[]:contents;const result=base.filter(c=>(!filter.q||[c.title,c.body,Object.values(c.summary||{}).flat().join(' '),...c.tags].join(' ').toLocaleLowerCase().includes(filter.q.toLocaleLowerCase()))&&(!filter.category||c.category===filter.category)&&(!filter.status||c.status===filter.status)&&(!filter.tag||c.tags.includes(filter.tag)));const tags=[...new Set(contents.flatMap(c=>c.tags))].slice(0,7);return `<div class="page-heading"><div><div class="eyebrow">YOUR KNOWLEDGE LIBRARY</div><h1>내 콘텐츠</h1><p>저장한 정보에서 다음 행동을 찾아보세요.</p></div><div class="heading-actions"><button class="btn primary" data-route="save">＋ 콘텐츠 저장</button></div></div><div class="overview-line"><span><b>${base.length}</b>개 저장됨</span><span class="divider"></span><span><b>${base.filter(c=>c.status==='READY').length}</b>개 요약 완료</span><span class="divider"></span><span><b>${base.filter(c=>c.status==='NEEDS_TEXT').length}</b>개 본문 필요</span></div><div class="filters"><div class="search"><span aria-hidden="true">⌕</span><input id="searchInput" aria-label="콘텐츠 검색" placeholder="제목, 본문, 요약, 태그 검색" value="${esc(filter.q)}"></div><select id="categoryFilter" aria-label="카테고리 필터"><option value="">모든 카테고리</option>${categories.map(v=>`<option ${filter.category===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="statusFilter" aria-label="분석 상태 필터"><option value="">모든 상태</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${filter.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="tag-row"><span class="muted">태그</span><button class="tag-btn ${!filter.tag?'active':''}" data-tag="" aria-pressed="${!filter.tag}">전체</button>${tags.map(t=>`<button class="tag-btn ${filter.tag===t?'active':''}" data-tag="${esc(t)}" aria-pressed="${filter.tag===t}">#${esc(t)}</button>`).join('')}${Object.values(filter).some(Boolean)?'<button class="btn ghost compact" id="clearFilters">초기화</button>':''}</div><div class="result-head"><span>${result.length}개 콘텐츠${filter.tag?' · #'+esc(filter.tag):''}</span><span>최근 등록순</span></div>${!base.length?emptyHTML('아직 저장한 콘텐츠가 없어요','유용한 AI 링크나 글을 저장해 첫 번째 요약과 행동을 만들어보세요.','첫 콘텐츠 저장하기','save'):!result.length?emptyHTML('검색 결과가 없어요','다른 검색어를 사용하거나 필터를 초기화해보세요.','필터 초기화','clear'):`<div class="table-head"><span>콘텐츠</span><span>분석 상태</span><span>Action Items</span><span class="date-label">등록일</span></div>${result.map(c=>`<article class="content-row"><div class="content-info"><button class="title-link" data-open="${c.id}">${esc(c.title)}</button><div class="meta"><span>${esc(c.source)}</span><span>·</span><span>${esc(c.category)}</span></div><div class="row-tags">${c.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div><div>${statusHTML(c)}</div><div class="row-progress">${c.actions.length?done(c)+' / '+c.actions.length:'—'}<div class="mini-track"><span style="width:${c.actions.length?100*done(c)/c.actions.length:0}%"></span></div></div><time class="row-date">${esc(c.date.slice(5))}</time></article>`).join('')}<div class="pagination"><span class="page-num active" aria-label="현재 1페이지">1</span><span class="muted small" style="padding:3px 6px">총 1페이지</span></div>`}<div class="list-foot">✓ 저장된 원문은 AI 분석이 실패해도 유지됩니다.</div>`;}
function emptyHTML(title,text,button,action){return `<div class="empty"><div class="empty-icon" aria-hidden="true">▤</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${button?`<button class="btn ${action==='save'?'primary':''}" ${action==='save'?'data-route="save"':'id="clearFilters"'}>${esc(button)}</button>`:''}</div>`}

20" placeholder="비워두면 본문 또는 출처에서 제목을 만듭니다." value="${esc(d.title||'')}"></div><div class="field-grid"><div class="field"><label for="categoryInput">카테고리</label><select id="categoryInput">${categories.map(c=>`<option ${c===(d.category||'미분류')?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="tagsInput">태그 <span class="optional">선택</span></label><input id="tagsInput" placeholder="개발, AI 도구" value="${esc((d.tags||[]).join(', '))}" aria-describedby="tagHint tagError"><div class="helper" id="tagHint">쉼표로 구분 · 최대 5개 · 각 20자</div><div class="error" id="tagError"></div></div></div><div class="privacy">요약을 위해 입력 본문이 외부 AI 제공자에게 전달됩니다. 민감한 정보는 입력하지 마세요.</div>${editing?'<div class="helper small muted" style="margin-top:12px">본문을 수정하면 이전 요약은 보존되며 ‘이전 본문 기준’으로 표시됩니다.</div>':''}<div id="saveError" class="error small" role="alert" style="color:var(--danger);margin-top:12px"></div><div class="form-actions"><button type="button" class="btn" data-route="${editing?'detail':'library'}">취소</button><button class="btn primary" id="submitSave" type="submit">${editing?'변경사항 저장':'저장하고 요약하기'}</button></div></form><aside class="guide"><h3>저장 다음에는</h3><ol><li>핵심 내용과 중요한 이유를 읽습니다.</li><li>AI가 제안한 다음 행동을 확인합니다.</li><li>직접 실행하고 완료를 기록합니다.</li></ol><hr><h3>링크에서 본문을 못 가져오나요?</h3><p class="small muted">Instagram·Threads처럼 접근이 제한된 자료도 링크는 보관할 수 있습니다. 본문을 직접 붙여넣으면 분석을 이어갈 수 있습니다.</p></aside></div>`;}
function noticeHTML(c){let title='',text='',action='',cls='';if(c.status==='NEEDS_TEXT'){title='링크는 저장했어요. 본문이 필요합니다.';text='페이지에 접근하지 못했거나 분석할 내용이 부족합니다. 원문을 복사해 붙여넣으세요.';action='<button class="btn compact" id="supplyText">본문 붙여넣기</button>';cls='warn'}if(c.status==='EXTRACTING'){title='본문을 가져오는 중입니다';text='콘텐츠는 저장되었습니다. 수집이 어려우면 본문 입력으로 이어집니다.';cls='loading'}if(c.status==='QUEUED'){title='AI 분석을 기다리고 있어요';text='자료는 저장되었습니다. 작업이 시작되면 분석 상태가 바뀝니다.';cls='loading'}if(c.status==='ANALYZING'){title='핵심 내용과 다음 행동을 정리하고 있어요';text='분석 중에도 원문을 확인하거나 목록으로 이동할 수 있습니다.';cls='loading'}if(c.status==='FAILED'){title='AI 분석을 완료하지 못했어요';text='요청 시간 초과 예시입니다. 원문과 이전 결과는 보존되며 다시 시도할 수 있습니다.';action='<button class="btn compact" id="retryAnalysis">다시 분석하기</button>';cls='error'}if(c.stale&&c.status==='READY'){title='이전 본문을 기준으로 생성한 결과입니다';text='원문이 수정되었습니다. 최신 내용을 반영하려면 다시 분석하세요.';action='<button class="btn compact" id="retryAnalysis">다시 분석하기</button>';cls='warn'}return title?`<div class="notice ${cls}" role="status"><div><strong>${cls==='loading'?'<span class="loader" aria-hidden="true"></span>':''}${title}</strong><span class="muted">${text}</span></div>${action}</div>`:''}
function detailHTML(){const c=current();if(!c)return emptyHTML('콘텐츠를 찾을 수 없어요','목록에서 다른 콘텐츠를 선택하세요.','내 콘텐츠로','clear');const s=c.summary;return `<button class="back" data-route="library">← 내 콘텐츠로 돌아가기</button><div class="page-heading detail-heading"><div><div class="eyebrow">SAVE → UNDERSTAND → ACT</div><h1 class="detail-title">${esc(c.title)}</h1><div class="detail-meta"><span>${esc(c.source)}</span><span>·</span><span>${esc(c.category)}</span><span>·</span><span>${esc(c.date)}</span>${statusHTML(c)}</div><div class="row-tags">${c.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div><div class="heading-actions"><button class="btn compact" id="editContent">편집</button><button class="btn ghost compact danger" id="deleteContent">삭제</button></div></div>${noticeHTML(c)}<div class="detail-tabs" role="tablist" aria-label="콘텐츠 상세"><button class="detail-tab ${detailTab==='summary'?'active':''}" data-tab="summary" id="summaryTab" role="tab" aria-selected="${detailTab==='summary'}" aria-controls="detailPanel">AI 요약</button><button class="detail-tab ${detailTab==='actions'?'active':''}" data-tab="actions" id="actionsTab" role="tab" aria-selected="${detailTab==='actions'}" aria-controls="detailPanel">Action Items ${c.actions.length?`(${c.actions.length})`:''}</button><button class="detail-tab ${detailTab==='original'?'active':''}" data-tab="original" id="originalTab" role="tab" aria-selected="${detailTab==='original'}" aria-controls="detailPanel">원문</button></div><section id="detailPanel" role="tabpanel" aria-labelledby="${detailTab==='summary'?'summaryTab':detailTab==='actions'?'actionsTab':'originalTab'}">${detailTab==='original'?originalHTML(c):detailTab==='actions'?contentActionsHTML(c):s?`<div class="detail-grid"><div><div class="summary-lead">${esc(s.headline)}</div><section class="section"><h3><span class="number">01</span>핵심 내용</h3><ul class="keypoints">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section><section class="section"><h3><span class="number">02</span>왜 중요한가요? <span class="small muted" style="font-weight:400">AI의 활용 해석</span></h3><p>${esc(s.importance)}</p></section><section class="section"><h3><span class="number">03</span>관련 기술</h3><div class="tech-list">${s.tech.length?s.tech.map(t=>`<span class="tech">${esc(t)}</span>`).join(''):'<span class="small muted">원문에서 확인되는 관련 기술이 없습니다.</span>'}</div></section><section class="section"><h3><span class="number">04</span>주요 키워드</h3><div class="tech-list">${s.keywords.map(t=>`<button class="tag-btn" data-keyword="${esc(t)}">${esc(t)}</button>`).join('')}</div></section><div class="ai-label">AI가 생성한 요약 · ${c.stale?'이전 본문 기준':'현재 본문 기준'}<button class="btn ghost compact" data-tab="original">원문과 비교하기 →</button></div><div style="margin-top:14px"><button class="btn ghost compact" id="retryAnalysis">다시 분석하기</button></div></div><aside class="action-aside"><div class="aside-head"><h3>다음 행동</h3><span class="small muted">${done(c)} / ${c.actions.length}</span></div><div class="small muted">읽은 정보를 실행으로 연결하세요.</div>${c.actions.length?c.actions.map(a=>`<label class="aside-task ${a.done?'done':''}"><input type="checkbox" data-check="${a.id}" ${a.done?'checked':''} aria-label="${esc(a.title)} 완료"><span>${esc(a.title)}</span></label>`).join(''):'<p class="small muted" style="padding:16px 0">이 자료에서 바로 실행할 행동을 찾지 못했습니다.</p>'}<button class="btn compact" data-tab="actions">행동 상세 보기 →</button></aside></div>`:emptyHTML(c.status==='NEEDS_TEXT'?'본문을 입력하면 요약을 만들 수 있어요':c.status==='FAILED'?'아직 분석 결과가 없어요':'분석 결과를 기다리고 있어요','원문 탭에서 저장된 정보를 확인할 수 있습니다.','','')}</section>`;}
function originalHTML(c){return `<div class="source-link"><strong class="small">원문 출처</strong>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.url)} ↗</a>`:'<span class="small muted">직접 입력한 텍스트</span>'}</div>${c.body?`<article class="original">${esc(c.body)}</article>`:emptyHTML('아직 본문이 없어요','원문에서 내용을 복사한 뒤 편집 화면에 붙여넣으세요.','','')}<div style="margin-top:20px"><button class="btn compact" id="editOriginal">본문 편집</button></div>`}
function progressHTML(c){return `<div class="wide-progress"><strong>${done(c)} / ${c.actions.length} 완료</strong><div class="mini-track" role="progressbar" aria-valuenow="${done(c)}" aria-valuemin="0" aria-valuemax="${Math.max(c.actions.length,1)}" aria-label="행동 완료"><span style="width:${c.actions.length?100*done(c)/c.actions.length:0}%"></span></div></div>`}
function contentActionsHTML(c){return `<div class="small muted">AI가 제안한 행동입니다. 목적에 맞게 수정하거나 삭제하세요.</div>${c.actions.length?progressHTML(c)+`<div class="tasks-section">${c.actions.map(a=>taskHTML(a,c,false)).join('')}</div>`:emptyHTML('실행할 행동이 없어요',c.summary?'이 자료는 정보 확인 중심이어서 구체적인 행동을 제안하지 않았습니다.':c.status==='NEEDS_TEXT'?'본문을 추가하면 행동을 생성할 수 있습니다.':'분석이 완료되면 다음 행동이 표시됩니다.','','')}`}
function taskHTML(a,c,showSource){if(editingAction===a.id)return `<article class="task"><div class="inline-edit"><label class="small" for="taskTitleInput">행동 제목</label><input id="taskTitleInput" value="${esc(a.title)}" maxlength="120"><label class="small" for="taskDescInput">완료 기준</label><textarea id="taskDescInput" maxlength="1000">${esc(a.description)}</textarea><div class="heading-actions"><button class="btn compact" id="cancelTaskEdit">취소</button><button class="btn primary compact" id="saveTaskEdit" data-id="${a.id}">저장</button></div></div></article>`;return `<article class="task ${a.done?'done':''}"><input type="checkbox" data-check="${a.id}" ${a.done?'checked':''} aria-label="${esc(a.title)} 완료"><div class="task-body"><div class="task-title">${esc(a.title)}</div><p class="task-description">${esc(a.description)}</p>${showSource?`<div class="task-source">원본 콘텐츠 · <button data-open="${c.id}" data-tab-open="actions">${esc(c.title)}</button></div>`:''}<span class="origin">AI 제안${a.done?' · 완료됨':''}</span></div><div class="task-tools"><button class="btn ghost compact" data-edit-action="${a.id}">수정</button><button class="btn ghost compact danger" data-delete-action="${a.id}">삭제</button></div></article>`}
function actionsHTML(){const all=allActions(),pending=all.filter(a=>!a.done),complete=all.filter(a=>a.done),items=actionFilter==='all'?all:actionFilter==='done'?complete:pending;return `<div class="page-heading"><div><div class="eyebrow">TURN KNOWLEDGE INTO ACTION</div><h1>Action Items</h1><p>저장한 정보에서 나온 다음 행동을 실행하세요.</p></div></div><div class="action-filters"><div class="segmented" aria-label="행동 상태 필터"><button data-action-filter="pending" class="${actionFilter==='pending'?'active':''}" aria-pressed="${actionFilter==='pending'}">미완료 ${pending.length}</button><button data-action-filter="done" class="${actionFilter==='done'?'active':''}" aria-pressed="${actionFilter==='done'}">완료 ${complete.length}</button><button data-action-filter="all" class="${actionFilter==='all'?'active':''}" aria-pressed="${actionFilter==='all'}">전체 ${all.length}</button></div><span class="muted">콘텐츠 등록순 · 행동 순서</span></div>${items.length?`<div class="tasks-section">${items.map(a=>taskHTML(a,a.content,true)).join('')}</div>`:emptyHTML(actionFilter==='done'?'아직 완료한 행동이 없어요':actionFilter==='pending'?'남은 행동이 없어요':'아직 생성된 행동이 없어요',actionFilter==='done'?'미완료 목록에서 행동을 실행하고 체크해보세요.':actionFilter==='pending'?'새로운 정보를 저장해 다음 학습을 이어가세요.':'콘텐츠를 저장하고 AI 분석을 완료해보세요.','','')}<div class="list-foot">체크하면 완료로 이동합니다. 완료 탭에서 체크를 해제하면 되돌릴 수 있습니다.</div>`}
function bindScreen(){document.querySelectorAll('[role=tab]').forEach(button=>button.tabIndex=button.getAttribute('aria-selected')==='true'?0:-1);if(route==='library'){$('searchInput').addEventListener('input',e=>{const start=e.target.selectionStart;filter.q=e.target.value;const y=window.scrollY;render();$('searchInput').focus({preventScroll:true});$('searchInput').setSelectionRange(start,start);window.scrollTo(0,y)});$('categoryFilter').addEventListener('change',e=>{filter.category=e.target.value;render()});$('statusFilter').addEventListener('change',e=>{filter.status=e.target.value;render()})}if(route==='save'){$('saveForm').addEventListener('submit',saveContent);$('bodyInput').addEventListener('input',()=>$('charCount').textContent=$('bodyInput').value.trim().length.toLocaleString());$('urlTab').addEventListener('click',()=>switchType('url'));$('textTab').addEventListener('click',()=>switchType('text'))}}
function draftFromForm(){return {url:$('sourceUrl').value,body:$('bodyInput').value,title:$('titleInput').value,category:$('categoryInput').value,tags:$('tagsInput').value.split(',').map(t=>t.trim()).filter(Boolean)}}
function switchType(type){formDraft=draftFromForm();inputType=type;render()}
function validUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password&&u.hostname.includes('.')&&value.length<=2048}catch{return false}}
function normalizeUrl(value){const u=new URL(value);u.hash='';return u.href}
function fieldError(id,errorId,text){$(id).setAttribute('aria-invalid','true');$(errorId).textContent=text}
async function saveContent(e){e.preventDefault();const d=draftFromForm();d.body=d.body.trim();d.url=d.url.trim();d.title=d.title.trim();let invalid=false;['sourceUrl','bodyInput','tagsInput'].forEach(id=>$(id).removeAttribute('aria-invalid'));['urlError','bodyError','tagError','saveError'].forEach(id=>$(id).textContent='');if((inputType==='url'&&!d.url)||(d.url&&!validUrl(d.url))){fieldError('sourceUrl','urlError','공개된 http/https URL을 입력해주세요.');invalid=true}if((inputType==='text'&&!d.body)||(d.body&&d.body.length<100)||d.body.length>20000){fieldError('bodyInput','bodyError','본문은 100~20,000자로 입력해주세요.');invalid=true}d.tags=[...new Set(d.tags)];if(d.tags.length>5||d.tags.some(t=>t.length>20)){fieldError('tagsInput','tagError','태그는 최대 5개, 각 20자로 입력해주세요.');invalid=true}if(invalid){$('saveForm').querySelector('[aria-invalid=true]').focus();return}const duplicate=d.url&&contents.find(c=>(!editing||c.id!==selected)&&c.url&&normalizeUrl(c.url)===normalizeUrl(d.url));if(duplicate){$('saveError').innerHTML=`이미 저장된 링크입니다. <button type="button" class="btn ghost compact" data-open="${duplicate.id}">기존 콘텐츠: ${esc(duplicate.title)} →</button>`;return}if(scenario==='saveerror'){$('saveError').textContent='저장하지 못했습니다. 입력 내용은 유지됩니다. 다시 시도해주세요. (실패 상태 예시)';scenario='normal';$('statePicker').value='normal';return}const submit=$('submitSave');submit.disabled=true;submit.textContent='저장 중…';await new Promise(r=>setTimeout(r,350));const source=d.url?new URL(d.url).hostname:'직접 입력';if(editing){const c=current(),changed=c.body!==d.body;Object.assign(c,{title:d.title||c.title,url:d.url,source,body:d.body,category:d.category,tags:d.tags});if(changed){c.version=(c.version||0)+1;c.running=false;c.stale=!!c.summary;c.status=d.body?'READY':'NEEDS_TEXT';if(!c.summary&&d.body){go('detail',{id:c.id});startAnalysis(c,false);notify('본문을 저장했습니다. 예시 분석을 시작합니다.');return}}go('detail',{id:c.id});notify('변경사항을 저장했습니다.');return}const c={id:'c'+Date.now(),title:d.title||(d.body?d.body.split(/\n|[.!?。]/)[0].slice(0,70):source+'에서 저장한 콘텐츠'),source,url:d.url,body:d.body,category:d.category,tags:d.tags,date:'2026.10.01',status:d.body?'QUEUED':'EXTRACTING',stale:false,summary:null,actions:[],version:0};contents.unshift(c);scenario='normal';$('statePicker').value='normal';go('detail',{id:c.id,tab:'summary'});notify('콘텐츠를 저장했습니다.');if(c.body)startAnalysis(c,false);else{const ver=c.version;jobTimers.push(setTimeout(()=>{if(contents.includes(c)&&c.version===ver){c.status='NEEDS_TEXT';renderIfVisible(c);notify('본문을 붙여넣으면 분석을 이어갈 수 있습니다.')}},900))}}
function renderIfVisible(c){if(route==='library'||route==='actions'||(route==='detail'&&selected===c.id))render();else syncChrome()}
function startAnalysis(c,replace){if(!c.body){go('save',{edit:true});notify('분석할 본문을 먼저 입력해주세요.');return}if(['QUEUED','ANALYZING'].includes(c.status)&&c.running){notify('이미 분석 작업이 진행 중입니다.');return}c.version=(c.version||0)+1;const ver=c.version;c.status='QUEUED';c.running=true;renderIfVisible(c);jobTimers.push(setTimeout(()=>{if(!contents.includes(c)||c.version!==ver)return;c.status='ANALYZING';renderIfVisible(c);jobTimers.push(setTimeout(()=>{if(!contents.includes(c)||c.version!==ver)return;const retained=c.actions.filter(a=>a.done);c.summary={headline:'입력한 자료의 핵심과 실행 단계를 정리하는 요약 영역입니다. (데모 결과)',points:['실제 서비스에서는 입력한 본문에 근거한 핵심 내용을 표시합니다.','이 와이어프레임의 결과는 화면 검토를 위한 고정 예시입니다.'],importance:'저장한 자료를 이해한 뒤 작은 검증 행동으로 연결할 수 있습니다. 이 문장은 실제 LLM 분석이 아닌 예시입니다.',tech:[],keywords:['학습','실습']};c.actions=[...(replace?retained:[]),{id:'demo'+Date.now()+'1',title:'자료의 핵심 내용을 확인한다',description:'원문과 요약을 비교하고 적용할 내용 1개를 메모하면 완료입니다. (데모 제안)',done:false},{id:'demo'+Date.now()+'2',title:'작은 적용 실험을 기록한다',description:'선택한 내용을 테스트하고 실행 과정과 결과를 기록하면 완료입니다. (데모 제안)',done:false}];c.tags=[...new Set([...c.tags,'학습'])].slice(0,5);c.status='READY';c.stale=false;c.running=false;renderIfVisible(c);notify('예시 요약과 행동이 준비되었습니다.')},1100))},650))}
function confirmAction(title,body,label,callback){$('dialogTitle').textContent=title;$('dialogBody').textContent=body;$('dialogConfirm').textContent=label;$('dialogConfirm').onclick=()=>{$('confirmDialog').close();callback()};$('confirmDialog').showModal();$('dialogCancel').focus()}
function retry(){const c=current();if(c.actions.some(a=>!a.done)){confirmAction('다시 분석할까요?','완료한 행동은 유지됩니다. 수정한 내용을 포함해 미완료 행동은 새 제안으로 교체됩니다.\n분석이 실패하면 이전 요약과 행동을 유지합니다.','다시 분석',()=>startAnalysis(c,true))}else startAnalysis(c,true)}
function setScenario(value){jobTimers.forEach(clearTimeout);jobTimers=[];scenario=value;contents=structuredClone(samples);filter={q:'',category:'',status:'',tag:''};selected='c1';detailTab='summary';editing=false;editingAction=null;if(value==='empty'){contents=[];route='library'}else if(value==='noresults'){route='library';filter.q='없는 검색어'}else if(value==='saveerror'){route='save';formDraft=null;inputType='text'}else if(value==='normal'){route='library'}else{route='detail';const c=current();if(value==='needs'){selected='c4'}if(value==='queued'){c.status='QUEUED';c.summary=null;c.actions=[]}if(value==='processing'){c.status='ANALYZING';c.summary=null;c.actions=[]}if(value==='failed'){c.status='FAILED';c.summary=null;c.actions=[]}if(value==='noactions'){c.actions=[];detailTab='actions'}if(value==='stale'){c.stale=true;c.body+='\n수정된 본문이 추가되었습니다.'}}render()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.route){go(el.dataset.route);return}if(el.dataset.open){go('detail',{id:el.dataset.open,tab:el.dataset.tabOpen||'summary'});return}if(el.dataset.tag!==undefined){filter.tag=el.dataset.tag;route='library';scenario='normal';$('statePicker').value='normal';render();return}if(el.dataset.keyword){filter={q:el.dataset.keyword,category:'',status:'',tag:''};route='library';render();return}if(el.dataset.tab){detailTab=el.dataset.tab;render();return}if(el.id==='clearFilters'){filter={q:'',category:'',status:'',tag:''};scenario='normal';$('statePicker').value='normal';go('library');return}if(el.id==='editContent'||el.id==='editOriginal'||el.id==='supplyText'){go('save',{edit:true});if(el.id==='supplyText')$('bodyInput').focus();return}if(el.id==='deleteContent'){const c=current();confirmAction('콘텐츠를 삭제할까요?',`‘${c.title}’의 원문, 요약, 연결된 행동 ${c.actions.length}개가 함께 삭제됩니다. 삭제 후에는 복구할 수 없습니다.`,'삭제',()=>{c.version=(c.version||0)+1;contents=contents.filter(x=>x.id!==c.id);go('library');notify('콘텐츠를 삭제했습니다.')});return}if(el.id==='retryAnalysis'){retry();return}if(el.dataset.actionFilter){actionFilter=el.dataset.actionFilter;editingAction=null;render();return}if(el.dataset.editAction){editingAction=el.dataset.editAction;render();$('taskTitleInput').focus();return}if(el.id==='cancelTaskEdit'){editingAction=null;render();return}if(el.id==='saveTaskEdit'){const title=$('taskTitleInput').value.trim(),description=$('taskDescInput').value.trim();if(!title||!description){notify('행동 제목과 완료 기준을 모두 입력해주세요.');return}const a=allActions().find(x=>x.id===el.dataset.id),item=a.content.actions.find(x=>x.id===a.id);item.title=title;item.description=description;editingAction=null;render();notify('행동을 수정했습니다.');return}if(el.dataset.deleteAction){const a=allActions().find(x=>x.id===el.dataset.deleteAction);confirmAction('행동을 삭제할까요?',`‘${a.title}’을 삭제합니다. 콘텐츠와 다른 행동은 유지됩니다.`,'삭제',()=>{a.content.actions=a.content.actions.filter(x=>x.id!==a.id);render();notify('행동을 삭제했습니다.')});return}});
document.addEventListener('change',e=>{if(e.target.dataset.check){const a=allActions().find(x=>x.id===e.target.dataset.check);if(!a)return;const item=a.content.actions.find(x=>x.id===a.id);item.done=e.target.checked;item.completedAt=item.done?'2026-10-01T05:00:00Z':null;const id=item.id;render();const checkbox=document.querySelector(`[data-check="${id}"]`);if(checkbox)checkbox.focus({preventScroll:true});else if(route==='actions')document.querySelector('.segmented .active')?.focus({preventScroll:true});notify(item.done?'행동을 완료했습니다.':'행동을 미완료로 되돌렸습니다.')}});
$('screenPicker').addEventListener('change',e=>go(e.target.value));$('statePicker').addEventListener('change',e=>setScenario(e.target.value));$('resetBtn').addEventListener('click',()=>{setScenario('normal');$('statePicker').value='normal';actionFilter='pending';notify('예시 데이터를 초기화했습니다.')});$('mobileBtn').addEventListener('click',()=>{ $('viewport').classList.add('phone');$('mobileBtn').classList.add('active');$('desktopBtn').classList.remove('active');$('mobileBtn').setAttribute('aria-pressed','true');$('desktopBtn').setAttribute('aria-pressed','false')});$('desktopBtn').addEventListener('click',()=>{ $('viewport').classList.remove('phone');$('desktopBtn').classList.add('active');$('mobileBtn').classList.remove('active');$('desktopBtn').setAttribute('aria-pressed','true');$('mobileBtn').setAttribute('aria-pressed','false')});$('dialogCancel').addEventListener('click',()=>$('confirmDialog').close());
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...e.target.closest('[role=tablist]').querySelectorAll('[role=tab]')],index=tabs.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[next].click();document.querySelector('[role=tab][aria-selected=true]')?.focus()});
render();
})();
