name: Python CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-24.04
    outputs:
      ci_required: ${{ steps.paths.outputs.ci_required }}
      deploy_required: ${{ steps.paths.outputs.deploy_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - id: paths
        run: python scripts/ci/changed_paths.py

  build:
    name: Build portable bundle
    needs: changes
    if: needs.changes.outputs.ci_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ai-summit-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build once and record SHA-256
        run: python scripts/ci/package.py build --out dist --revision "$GITHUB_SHA"
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-summit-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  test:
    name: Matrix (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [changes, build]
    if: needs.changes.outputs.ci_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.12', '3.13', '3.14']
    uses: ./.github/workflows/reusable-python-checks.yml
    with:
      os: ${{ matrix.os }}
      python_version: ${{ matrix.python }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      revision: ${{ github.sha }}
      label: ${{ matrix.os }}-py${{ matrix.python }}
      use_cache: true

  deploy:
    name: Deploy verified bundle to GitHub Releases
    needs: [changes, build, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the tested build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: incoming
      - name: Recheck exact archive before distribution
        run: python scripts/ci/package.py verify --artifact-dir incoming --out release-check --revision "$GITHUB_SHA"
      - name: Inject secret and publish package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY" --silent
          python - <<'PY'
          import os
          from pathlib import Path
          run = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          notes = (
              "AI SUMMIT course demo package. This is a downloadable project bundle, not a hosted backend.\n\n"
              f"Source commit: {os.environ['GITHUB_SHA']}\nCI run: {run}\n\n"
              "The same archive passed Lint/Test on Ubuntu, Windows and macOS with Python 3.12, 3.13 and 3.14.\n"
              "Build -> Test -> Deploy; SHA-256 manifest included. No API keys or tokens are packaged.\n"
              "Extract ai-summit.zip and read ai-summit/README.md. DORA fixture output is example data.\n"
          )
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
          tag="course-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" incoming/ai-summit.zip incoming/bundle-manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AI SUMMIT course package $tag" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
