# .github/workflows/metrics.yml
name: DORA Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  push:
    branches: [main, feat/dora-automation]
    paths: ['.github/workflows/metrics.yml', 'scripts/dora/**', 'tests/test_dora.py']
  deployment_status:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]

permissions:
  contents: read
  deployments: read
  issues: read

concurrency:
  group: dora-metrics
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'incident') || github.event.label.name == 'incident'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metric calculations
        run: python -m unittest discover -s tests -v
      - name: Collect four DORA metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DORA_ENVIRONMENT: ${{ vars.DORA_ENVIRONMENT || 'production' }}
        run: python scripts/dora/collect.py --out dora-output
      - name: Publish weekly report in run summary
        run: cat dora-output/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save JSON, report and dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_id }}
          path: dora-output/
          retention-days: 90
          if-no-files-found: error
