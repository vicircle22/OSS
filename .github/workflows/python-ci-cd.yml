name: Python CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build portable bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ai-summit-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build once and record SHA-256
        run: python scripts/ci/package.py build --out dist --revision "$GITHUB_SHA"
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-summit-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  test:
    name: Lint and Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: incoming
      - name: Verify checksum and extract
        run: python scripts/ci/package.py verify --artifact-dir incoming --out unpacked --revision "$GITHUB_SHA"
      - name: Install pinned lint dependency
        working-directory: unpacked/ai-summit
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Lint the packaged code
        working-directory: unpacked/ai-summit
        run: python -m ruff check scripts tests
      - name: Test the packaged code
        working-directory: unpacked/ai-summit
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: unpacked/ai-summit/test-results.txt
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: Deploy verified bundle to GitHub Releases
    needs: [build, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the tested build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: incoming
      - name: Recheck exact archive before distribution
        run: python scripts/ci/package.py verify --artifact-dir incoming --out release-check --revision "$GITHUB_SHA"
      - name: Inject secret and publish package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY" --silent
          python - <<'PY'
          import os
          from pathlib import Path
          run = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          notes = (
              "AI SUMMIT course demo package. This is a downloadable project bundle, not a hosted backend.\n\n"
              f"Source commit: {os.environ['GITHUB_SHA']}\nCI run: {run}\n\n"
              "The same archive passed Lint/Test on Ubuntu, Windows and macOS with Python 3.12 and 3.13.\n"
              "Build -> Test -> Deploy; SHA-256 manifest included. No API keys or tokens are packaged.\n"
              "Extract ai-summit.zip and read ai-summit/README.md. DORA fixture output is example data.\n"
          )
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
          tag="course-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" incoming/ai-summit.zip incoming/bundle-manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AI SUMMIT course package $tag" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
